[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "netguard-common"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["alembic>=1.13", "sqlalchemy>=2.0.30", "psycopg[binary]>=3.2", "pydantic>=2.7", "pydantic-settings>=2.3"]
[project.scripts]
netguard-check-db = "netguard_common.check_db:main"
[tool.setuptools]
packages = ["netguard_common"]
