[tool.pytest.ini_options]
testpaths = ["shared/tests", "backend/tests", "monitor/tests"]
addopts = "-ra"
markers = ["integration: needs a live PostgreSQL (set NETGUARD_TEST_INTEGRATION=1)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
[tool.ruff.lint.isort]
known-first-party = ["netguard_common", "netguard_monitor", "app"]
[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106", "S608", "E501", "S104", "S311"]
"migrations/*" = ["E501", "S608", "I001"]
"lab/*" = ["E501", "S101", "S603", "S607", "S608"]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true
