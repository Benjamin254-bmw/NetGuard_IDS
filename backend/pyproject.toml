[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "netguard-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "netguard-common",
  "fastapi>=0.118",
  "uvicorn>=0.30",
  "websockets>=13",
  "argon2-cffi>=23.1",
  "PyJWT>=2.8",
]
[tool.setuptools.packages.find]
include = ["app*"]
