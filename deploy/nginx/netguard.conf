# NetGuard IDS: the dashboard and its API on ONE https origin (Phase 8, ADR 0020).
# Installed by deploy/install.sh as /etc/nginx/sites-available/netguard. __API_PORT__ is filled in there.
#
# Why one origin: the session cookie is SameSite=Strict and the API checks Origin on every unsafe request and
# on the WebSocket handshake (ADRs 0016-0017). Serving the built dashboard and proxying /api from the same
# host:port is what makes those checks pass without listing any extra origins.

map $http_upgrade $netguard_connection {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/netguard/tls/netguard.crt;
    ssl_certificate_key /etc/netguard/tls/netguard.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:netguard_tls:1m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;   # the API takes small JSON bodies only

    # Headers for the dashboard itself (the API sets its own, stricter ones on /api).
    # No HSTS by default: with a self-signed certificate it would stop browsers offering the "continue" button.
    # Add it once a certificate the browsers trust is installed (docs/deployment.md).
    set $netguard_csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://$http_host; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'";

    root /opt/netguard/www;

    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        # Keep the port in Host: the API compares the browser's Origin with scheme://Host.
        proxy_set_header Host $http_host;
        # OVERWRITE, never append: a client-supplied X-Forwarded-For must not reach the API.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $netguard_connection;
        proxy_read_timeout 75s;      # the WebSocket sends monitor status every 5 s, so this never idles out
        proxy_buffering off;
    }

    location /assets/ {
        # file names carry a content hash: cache for a year
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $netguard_csp always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $netguard_csp always;
        # client-side routes (/events/12, /rules, ...) all load the dashboard
        try_files $uri /index.html;
    }
}
